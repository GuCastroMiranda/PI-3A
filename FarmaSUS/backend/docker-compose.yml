version: '3.8'

services:
  db:
    image: postgres:15
    container_name: farmasus-pg
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: farmasus
    ports:
      - "5432:5432"
    volumes:
      - farmasus-pg-data:/var/lib/postgresql/data

volumes:
  farmasus-pg-data:
