version: '3.8'

services:
  api:
    build: .
    container_name: farmasus-api
    ports:
      - "3333:3333"
    environment:
      # Sobrescreve o .env para usar o host 'db' (nome do container do banco)
      - DATABASE_URL=postgresql://docker:docker@db:5432/farmasus?schema=public
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: farmasus-pg
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: farmasus
    ports:
      - "5432:5432"
    volumes:
      - farmasus-pg-data:/var/lib/postgresql/data

volumes:
  farmasus-pg-data:
